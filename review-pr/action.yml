name: "PR Review with docker-agent"
description: "AI-powered pull request review with automatic learning from feedback"
author: "Docker"
inputs:
  pr-number:
    description: "Pull request number to review (auto-detected from github.event if not provided)"
    required: false
    default: ""
  comment-id:
    description: "Comment ID for reactions (auto-detected from github.event if not provided)"
    required: false
    default: ""
  additional-prompt:
    description: "Additional instructions appended to the review (e.g., language-specific patterns, project conventions)"
    required: false
    default: ""
  anthropic-api-key:
    description: "Anthropic API key"
    required: false
  openai-api-key:
    description: "OpenAI API key"
    required: false
  google-api-key:
    description: "Google API key for Gemini models"
    required: false
  aws-bearer-token-bedrock:
    description: "AWS Bearer token for Bedrock models"
    required: false
  xai-api-key:
    description: "xAI API key for Grok models"
    required: false
  nebius-api-key:
    description: "Nebius API key"
    required: false
  mistral-api-key:
    description: "Mistral API key"
    required: false
  github-token:
    description: "GitHub token for API access (defaults to github.token)"
    required: false
  model:
    description: "Model to use for reviews (e.g., anthropic/claude-sonnet-4-5, openai/gpt-4o)"
    required: false
    default: ""
  add-prompt-files:
    description: "Comma-separated list of files to append to the prompt (e.g., 'AGENTS.md,CLAUDE.md')"
    required: false
    default: ""
  org-membership-token:
    description: "PAT with read:org scope for org membership authorization checks"
    required: false
    default: ""
  auth-org:
    description: "GitHub organization to check membership against"
    required: false
    default: ""
  skip-auth:
    description: "Skip the built-in authorization check (caller already verified auth)"
    required: false
    default: "false"
  exclude-paths:
    description: 'Newline-separated list of path patterns to exclude from review. Entries containing `*`, `?`, or `[` are matched as globs; entries ending with `/` match all files under that directory (e.g. `vendor/`); all other entries match the exact path. Example: `**/package-lock.json` excludes lock files at any depth.'
    required: false
    default: ''
  max-diff-lines:
    description: "Auto-filter cap: if the diff exceeds this many lines after removing score-0 files, lowest-risk files are progressively excluded until it fits. Set to 0 to disable. Default: 3000."
    required: false
    default: "3000"
outputs:
  exit-code:
    description: "Exit code from the review"
    value: ${{ steps.run-review.outputs.exit-code }}
  review-url:
    description: "URL to the posted review"
    value: ${{ steps.post-summary.outputs.review-url }}
runs:
  using: "composite"
  steps:
    - name: Chainguard usage telemetry
      shell: bash
      run: |
        # Best-effort, fails open. Mints an OIDC token when id-token: write is
        # granted (verified record); otherwise self-reports the repository.
        tok=""
        if [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ] && [ -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" ]; then
          tok=$(curl -sf --max-time 2 \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=actions.chainguard.dev" \
            | sed -n 's/.*"value":"\([^"]*\)".*/\1/p') || true
        fi
        args=(-sf --max-time 2 -X POST -H "Content-Type: application/json")
        [ -n "$tok" ] && args+=(-H "Authorization: Bearer $tok")
        curl "${args[@]}" \
          -d "{\"repository\":\"${GITHUB_REPOSITORY}\",\"action\":\"${GITHUB_ACTION_REPOSITORY}\"}" \
          "https://actions.enforce.dev/actions/v1/record" >/dev/null 2>&1 || true
    # ========================================
    # SETUP
    # ========================================
    - name: Resolve PR number and comment ID
      id: resolve-context
      shell: bash
      env:
        PR_NUMBER_INPUT: ${{ inputs.pr-number }}
        COMMENT_ID_INPUT: ${{ inputs.comment-id }}
        EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
        EVENT_ISSUE_NUMBER: ${{ github.event.issue.number }}
        EVENT_COMMENT_ID: ${{ github.event.comment.id }}
      run: |
        # Resolve PR number: input > pull_request event > issue event
        PR_NUMBER="$PR_NUMBER_INPUT"
        if [ -z "$PR_NUMBER" ]; then
          PR_NUMBER="$EVENT_PR_NUMBER"
        fi
        if [ -z "$PR_NUMBER" ]; then
          PR_NUMBER="$EVENT_ISSUE_NUMBER"
        fi
        if [ -z "$PR_NUMBER" ]; then
          echo "❌ Could not determine PR number. Provide pr-number input or trigger from a PR event."
          exit 1
        fi
        safe_pr=$(printf '%s' "$PR_NUMBER" | tr -d '\n\r')
        echo "pr-number=$safe_pr" >> "$GITHUB_OUTPUT"
        echo "✅ Resolved PR number: $safe_pr"

        # Resolve comment ID: input > comment event (optional, for reactions)
        COMMENT_ID="$COMMENT_ID_INPUT"
        if [ -z "$COMMENT_ID" ]; then
          COMMENT_ID="$EVENT_COMMENT_ID"
        fi
        safe_comment=$(printf '%s' "$COMMENT_ID" | tr -d '\n\r')
        echo "comment-id=$safe_comment" >> "$GITHUB_OUTPUT"
        if [ -n "$safe_comment" ]; then
          echo "✅ Resolved comment ID: $safe_comment"
        else
          echo "ℹ️  No comment ID - reactions will be skipped"
        fi
    # ========================================
    # GitHub Token Resolution
    # ========================================

    # Resolve which token to use: explicit github-token > default github.token
    - name: Resolve GitHub token
      id: resolve-token
      shell: bash
      run: |
        if [ -n "$EXPLICIT_TOKEN" ]; then
          echo "✅ Using provided github-token"
          safe_token=$(printf '%s' "$EXPLICIT_TOKEN" | tr -d '\n\r')
          echo "token=$safe_token" >> "$GITHUB_OUTPUT"
        else
          echo "ℹ️  Using default github.token"
          safe_token=$(printf '%s' "$DEFAULT_TOKEN" | tr -d '\n\r')
          echo "token=$safe_token" >> "$GITHUB_OUTPUT"
        fi
      env:
        EXPLICIT_TOKEN: ${{ inputs.github-token }}
        DEFAULT_TOKEN: ${{ github.token }}
    # Concurrent review guard: best-effort lock using GitHub Actions cache.
    # There is a narrow race window where two runs starting within seconds
    # can both pass the check before either saves its lock. This is accepted
    # because reviews are idempotent (duplicate reviews are harmless) and
    # the window is small enough that it rarely occurs in practice.
    - name: Check for concurrent review
      id: review-lock
      uses: chainguard-actions/actions-cache/restore@b5b76c7016521bd34554159c882773b3df2e994a # v5.0.5
      with:
        path: .cache/review-lock
        # Exact key will never match (saves include run_id), so this always
        # falls through to restore-keys prefix match — finding the most recent lock
        key: pr-review-lock-${{ github.repository }}-${{ steps.resolve-context.outputs.pr-number }}-exact
        restore-keys: |
          pr-review-lock-${{ github.repository }}-${{ steps.resolve-context.outputs.pr-number }}-
    - name: Evaluate review lock
      id: lock-check
      shell: bash
      env:
        CACHE_MATCHED_KEY: ${{ steps.review-lock.outputs.cache-matched-key }}
      run: "# cache-hit is only true on exact key match; prefix matches via restore-keys\n# set cache-matched-key but leave cache-hit as false\nif [ -n \"$CACHE_MATCHED_KEY\" ]; then\n  LOCK_TIME=$(cat .cache/review-lock/timestamp 2>/dev/null || echo \"0\")\n  NOW=$(date +%s)\n  AGE=$(( NOW - LOCK_TIME ))\n  if [ \"$AGE\" -lt 600 ]; then  # 600 s lock TTL — intentionally decoupled from the review timeout (now 1800 s)\n    echo \"⏭️ Review already in progress (started ${AGE}s ago) — skipping\"\n    echo \"skip=true\" >> $GITHUB_OUTPUT\n    echo \"skip-reason=concurrent\" >> $GITHUB_OUTPUT\n    echo \"lock-age=${AGE}\" >> $GITHUB_OUTPUT\n    exit 0\n  fi\n  echo \"\U0001F513 Stale lock (${AGE}s old) — proceeding\"\nfi\necho \"skip=false\" >> $GITHUB_OUTPUT\n"
    - name: Acquire review lock
      if: steps.lock-check.outputs.skip != 'true'
      shell: bash
      run: |
        mkdir -p .cache/review-lock
        date +%s > .cache/review-lock/timestamp
    - name: Save review lock
      if: steps.lock-check.outputs.skip != 'true'
      uses: chainguard-actions/actions-cache/save@b5b76c7016521bd34554159c882773b3df2e994a # v5.0.5
      with:
        path: .cache/review-lock
        # Use run_id in save key so each run can save (cache keys are immutable)
        # The restore step uses the fixed key with no run_id, so it matches via prefix
        key: pr-review-lock-${{ github.repository }}-${{ steps.resolve-context.outputs.pr-number }}-${{ github.run_id }}
    - name: Ensure cache directory exists
      if: steps.lock-check.outputs.skip != 'true'
      shell: bash
      env:
        WORKSPACE: ${{ github.workspace }}
      run: mkdir -p "$WORKSPACE/.cache"
    - name: Restore reviewer memory
      if: steps.lock-check.outputs.skip != 'true'
      id: restore-memory
      uses: chainguard-actions/actions-cache/restore@b5b76c7016521bd34554159c882773b3df2e994a # v5.0.5
      with:
        path: ${{ github.workspace }}/.cache/pr-review-memory.db
        key: pr-review-memory-${{ github.repository }}-${{ github.job }}-${{ github.run_id }}
        restore-keys: |
          pr-review-memory-${{ github.repository }}-${{ github.job }}-
          pr-review-memory-${{ github.repository }}-
    - name: Add eyes reaction
      if: steps.resolve-context.outputs.comment-id != '' && steps.lock-check.outputs.skip != 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ steps.resolve-token.outputs.token }}
        REPO: ${{ github.repository }}
        COMMENT_ID: ${{ steps.resolve-context.outputs.comment-id }}
      run: |
        gh api "repos/$REPO/issues/comments/$COMMENT_ID/reactions" \
          -X POST -f content='eyes' || true
    - name: Get PR information
      if: steps.lock-check.outputs.skip != 'true'
      id: pr-info
      shell: bash
      env:
        GH_TOKEN: ${{ steps.resolve-token.outputs.token }}
        PR_NUMBER: ${{ steps.resolve-context.outputs.pr-number }}
        REPO: ${{ github.repository }}
        READ_TOKEN: ${{ github.token }}
      run: |
        PR_URL="https://github.com/${REPO}/pull/${PR_NUMBER}"

        gh pr view "$PR_URL" --json files -q '.files[].path' > changed_files.txt
        gh pr view "$PR_URL" --json title,body,author,baseRefName,headRefName > pr_metadata.json
        echo "files_count=$(wc -l < changed_files.txt | tr -d ' ')" >> $GITHUB_OUTPUT

        # Pre-fetch diff for the agent so it doesn't need to call gh pr diff itself.
        # Uses github.token (has contents:read) instead of the App token (used for posting reviews).
        # Uses the full PR URL instead of just the number — gh can't resolve a bare number
        # from a detached HEAD (refs/pull/N/head).
        if GH_TOKEN="$READ_TOKEN" gh pr diff "$PR_URL" > pr.diff 2>pr_diff_stderr.txt; then
          echo "✅ Pre-fetched PR diff via gh pr diff ($(wc -l < pr.diff | tr -d ' ') lines)"
          rm -f pr_diff_stderr.txt
        else
          echo "::warning::gh pr diff failed: $(cat pr_diff_stderr.txt 2>/dev/null)"
          rm -f pr.diff pr_diff_stderr.txt

          # Fallback: git diff with merge-base (repo is checked out with full history)
          MERGE_BASE=$(git merge-base origin/main HEAD 2>/dev/null || git merge-base origin/master HEAD 2>/dev/null || echo "")
          if [ -n "$MERGE_BASE" ]; then
            if git diff "$MERGE_BASE"...HEAD > pr.diff; then
              echo "✅ Pre-fetched PR diff via git diff ($(wc -l < pr.diff | tr -d ' ') lines)"
            else
              echo "::warning::git diff failed — agent will fetch diff itself"
              rm -f pr.diff
            fi
          else
            echo "::warning::Could not determine merge base — agent will fetch diff itself"
          fi
        fi
    - name: Filter excluded paths from diff
      if: hashFiles('pr.diff') != '' && inputs.exclude-paths != ''
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        EXCLUDE_PATHS: ${{ inputs.exclude-paths }}
      run: |
        node "$ACTION_PATH/../dist/filter-diff.js" pr.diff "$EXCLUDE_PATHS"
    - name: Score file risk
      if: hashFiles('pr.diff') != ''
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        EXCLUDE_PATHS: ${{ inputs.exclude-paths }}
      run: |
        set -euo pipefail
        node "$ACTION_PATH/../dist/score-risk.js" pr.diff "$EXCLUDE_PATHS"
        echo "✅ File risk scores: $(jq -c . /tmp/file_risk_scores.json)"
    - name: Auto-filter low-risk files
      if: hashFiles('pr.diff') != '' && steps.lock-check.outputs.skip != 'true'
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        MAX_DIFF_LINES: ${{ inputs.max-diff-lines }}
      run: |
        node "$ACTION_PATH/../dist/auto-filter-diff.js" pr.diff "$MAX_DIFF_LINES"
    - name: Split diff into chunks
      if: hashFiles('pr.diff') != ''
      id: chunk-diff
      shell: bash
      run: "set -euo pipefail\n# Clean up stale chunk files from previous runs\nrm -f /tmp/drafter_chunk_*.diff\nTOTAL_LINES=$(wc -l < pr.diff | tr -d ' ')\necho \"\U0001F4C4 Diff is $TOTAL_LINES lines\"\n\nif [ \"$TOTAL_LINES\" -le 1500 ]; then\n  # Small diff — single chunk\n  cp pr.diff /tmp/drafter_chunk_1.diff\n  echo \"chunk_count=1\" >> $GITHUB_OUTPUT\n  # Build manifest: list all files in the diff\n  FILES=$(grep '^diff --git' pr.diff | sed 's|diff --git a/.* b/||' | jq -R . | jq -s '.')\n  echo \"chunk_manifest=$(jq -nc --argjson f \"$FILES\" '{\"1\": $f}')\" >> $GITHUB_OUTPUT\n  echo \"✅ Single chunk ($TOTAL_LINES lines)\"\nelse\n  # Large diff — split at file boundaries, targeting ~600 lines per chunk\n  CHUNK=1\n  CHUNK_LINES=0\n  CURRENT_FILE=\"\"\n  CURRENT_DIR=\"\"\n  MANIFEST=\"{}\"\n  CHUNK_FILES=\"[]\"\n\n  # Create first chunk file\n  > /tmp/drafter_chunk_1.diff\n\n  while IFS= read -r line; do\n    if [[ \"$line\" == \"diff --git\"* ]]; then\n      FILE=$(echo \"$line\" | sed 's|diff --git a/.* b/||')\n      DIR=$(dirname \"$FILE\")\n\n      # Start new chunk if:\n      #   - over soft limit (600 lines) and directory changed, OR\n      #   - over hard limit (2000 lines) regardless of directory\n      if ([ \"$CHUNK_LINES\" -gt 600 ] && [ \"$DIR\" != \"$CURRENT_DIR\" ]) || [ \"$CHUNK_LINES\" -gt 2000 ]; then\n        # Save current chunk's file list to manifest\n        MANIFEST=$(echo \"$MANIFEST\" | jq --argjson files \"$CHUNK_FILES\" --arg k \"$CHUNK\" '.[$k] = $files')\n        CHUNK=$((CHUNK + 1))\n        CHUNK_LINES=0\n        CHUNK_FILES=\"[]\"\n        > /tmp/drafter_chunk_${CHUNK}.diff\n      fi\n\n      CURRENT_FILE=\"$FILE\"\n      CURRENT_DIR=\"$DIR\"\n      CHUNK_FILES=$(echo \"$CHUNK_FILES\" | jq --arg f \"$FILE\" '. += [$f]')\n    fi\n\n    echo \"$line\" >> /tmp/drafter_chunk_${CHUNK}.diff\n    CHUNK_LINES=$((CHUNK_LINES + 1))\n  done < pr.diff\n\n  # Save final chunk's file list\n  MANIFEST=$(echo \"$MANIFEST\" | jq --argjson files \"$CHUNK_FILES\" --arg k \"$CHUNK\" '.[$k] = $files')\n\n  echo \"chunk_count=$CHUNK\" >> $GITHUB_OUTPUT\n  echo \"chunk_manifest=$(echo \"$MANIFEST\" | jq -c .)\" >> $GITHUB_OUTPUT\n  echo \"✅ Split into $CHUNK chunks (target ~600 lines each)\"\n\n  for i in $(seq 1 $CHUNK); do\n    LINES=$(wc -l < /tmp/drafter_chunk_${i}.diff | tr -d ' ')\n    FILES_IN_CHUNK=$(echo \"$MANIFEST\" | jq -r --arg k \"$i\" '.[$k] | length')\n    echo \"  Chunk $i: $LINES lines, $FILES_IN_CHUNK files\"\n  done\nfi\n"
    - name: Generate file history
      if: hashFiles('changed_files.txt') != ''
      shell: bash
      run: |
        > /tmp/file_history.txt
        while IFS= read -r file; do
          # Skip new files (no git history)
          HISTORY=$(git log --oneline -5 -- "$file" 2>/dev/null || true)
          if [ -n "$HISTORY" ]; then
            echo "## $file" >> /tmp/file_history.txt
            echo "$HISTORY" >> /tmp/file_history.txt
            echo "" >> /tmp/file_history.txt
          fi
        done < changed_files.txt

        ENTRIES=$(grep -c '^## ' /tmp/file_history.txt 2>/dev/null || echo "0")
        echo "✅ Generated history for $ENTRIES file(s)"
    - name: Resolve stale review threads
      if: steps.lock-check.outputs.skip != 'true'
      continue-on-error: true
      shell: bash
      env:
        GH_TOKEN: ${{ steps.resolve-token.outputs.token }}
        PR_NUMBER: ${{ steps.resolve-context.outputs.pr-number }}
        REPO: ${{ github.repository }}
      run: "echo \"\U0001F50D Checking for stale bot review threads to resolve...\"\n\n# A. Parse diff → file:line set\n# Tracks current file from \"diff --git\" headers, line numbers from @@ hunks,\n# and emits \"file:line\" for each added (+) line.\nif [ ! -f pr.diff ]; then\n  echo \"ℹ️  No pr.diff found — skipping stale thread resolution\"\n  exit 0\nfi\n\nDIFF_LINES_FILE=$(mktemp)\ntrap \"rm -f '$DIFF_LINES_FILE'\" EXIT\n\nawk '\n  /^\\+\\+\\+ b\\// {\n    # Extract file path from \"+++ b/foo\" (unambiguous, unlike diff --git header)\n    file = substr($0, 7)\n  }\n  /^@@ / {\n    # Parse new file line number from \"@@ -X,Y +Z,W @@\"\n    match($0, /\\+([0-9]+)/, arr)\n    line = arr[1]\n    next\n  }\n  /^\\+[^+]/ || /^\\+$/ {\n    # Added line (but not the +++ header)\n    if (file != \"\" && line > 0) {\n      print file \":\" line\n    }\n    line++\n  }\n  /^ / { line++ }\n  /^-/ { next }\n' pr.diff | sort -u > $DIFF_LINES_FILE\n\nDIFF_LINE_COUNT=$(wc -l < $DIFF_LINES_FILE | tr -d ' ')\necho \"\U0001F4C4 Found $DIFF_LINE_COUNT unique file:line pairs in diff\"\n\n# B. Fetch all review threads via GraphQL (paginated)\nOWNER=\"${REPO%%/*}\"\nREPO_NAME=\"${REPO##*/}\"\n\nQUERY='\nquery($owner: String!, $repo: String!, $pr: Int!, $cursor: String) {\n  repository(owner: $owner, name: $repo) {\n    pullRequest(number: $pr) {\n      reviewThreads(first: 100, after: $cursor) {\n        pageInfo { hasNextPage endCursor }\n        nodes {\n          id\n          isResolved\n          path\n          line\n          comments(first: 5) {\n            nodes { body }\n          }\n        }\n      }\n    }\n  }\n}'\n\nALL_THREADS=\"[]\"\nCURSOR=\"\"\nPAGE=0\nFETCH_OK=true\n\nwhile true; do\n  PAGE=$((PAGE + 1))\n\n  GQL_ARGS=(-f query=\"$QUERY\" -f owner=\"$OWNER\" -f repo=\"$REPO_NAME\" -F pr=\"$PR_NUMBER\")\n  if [ -n \"$CURSOR\" ]; then\n    GQL_ARGS+=(-f cursor=\"$CURSOR\")\n  fi\n\n  RESULT=$(gh api graphql \"${GQL_ARGS[@]}\" 2>&1) || {\n    echo \"::warning::GraphQL query failed (page $PAGE): $RESULT\"\n    FETCH_OK=false\n    break\n  }\n\n  # Check for GraphQL errors in response (HTTP 200 can still contain errors)\n  if echo \"$RESULT\" | jq -e '.errors' > /dev/null 2>&1; then\n    echo \"::warning::GraphQL returned errors: $(echo \"$RESULT\" | jq -c '.errors')\"\n    FETCH_OK=false\n    break\n  fi\n\n  THREADS=$(echo \"$RESULT\" | jq '.data.repository.pullRequest.reviewThreads.nodes // []') || {\n    echo \"::warning::Failed to parse threads on page $PAGE\"\n    FETCH_OK=false\n    break\n  }\n  ALL_THREADS=$(echo \"$ALL_THREADS\" \"$THREADS\" | jq -s '.[0] + .[1]') || {\n    echo \"::warning::Failed to merge threads on page $PAGE\"\n    FETCH_OK=false\n    break\n  }\n\n  HAS_NEXT=$(echo \"$RESULT\" | jq -r '.data.repository.pullRequest.reviewThreads.pageInfo.hasNextPage')\n  if [ \"$HAS_NEXT\" != \"true\" ]; then\n    break\n  fi\n  CURSOR=$(echo \"$RESULT\" | jq -r '.data.repository.pullRequest.reviewThreads.pageInfo.endCursor')\ndone\n\nif [ \"$FETCH_OK\" != \"true\" ]; then\n  echo \"::warning::Thread fetch incomplete — skipping resolution to avoid acting on partial data\"\n  exit 0\nfi\n\nTOTAL_THREADS=$(echo \"$ALL_THREADS\" | jq 'length')\necho \"\U0001F4CB Fetched $TOTAL_THREADS review threads (across $PAGE page(s))\"\n\n# C. Filter to unresolved bot threads (containing <!-- cagent-review --> marker)\nBOT_THREADS=$(echo \"$ALL_THREADS\" | jq '[\n  .[] | select(\n    .isResolved == false and\n    (.comments.nodes | any(.body | contains(\"<!-- cagent-review -->\")))\n  )\n]')\n\nBOT_COUNT=$(echo \"$BOT_THREADS\" | jq 'length')\nif [ -z \"$BOT_COUNT\" ] || ! [[ \"$BOT_COUNT\" =~ ^[0-9]+$ ]]; then\n  echo \"::warning::Failed to count bot threads\"\n  exit 0\nfi\necho \"\U0001F916 Found $BOT_COUNT unresolved bot review thread(s)\"\n\nif [ \"$BOT_COUNT\" -eq 0 ]; then\n  echo \"✅ No stale bot threads to resolve\"\n  exit 0\nfi\n\n# D. Resolve stale threads (file:line no longer in diff)\nRESOLVED=0\nKEPT=0\n\nfor i in $(seq 0 $((BOT_COUNT - 1))); do\n  THREAD_ID=$(echo \"$BOT_THREADS\" | jq -r \".[$i].id\")\n  THREAD_PATH=$(echo \"$BOT_THREADS\" | jq -r \".[$i].path\")\n  THREAD_LINE=$(echo \"$BOT_THREADS\" | jq -r \".[$i].line\")\n\n  # Skip threads with null path (file-level or unknown context)\n  if [ \"$THREAD_PATH\" = \"null\" ] || [ -z \"$THREAD_PATH\" ]; then\n    echo \"  ⏭️  Keeping open: thread $THREAD_ID (no file path)\"\n    KEPT=$((KEPT + 1))\n    continue\n  fi\n\n  # Null line means GitHub marked the comment \"outdated\" — the code changed\n  # since the comment was posted and the position is no longer valid.\n  # These are stale by definition and should be resolved.\n  SHOULD_RESOLVE=false\n  if [ \"$THREAD_LINE\" = \"null\" ] || [ -z \"$THREAD_LINE\" ]; then\n    echo \"  \U0001F504 Outdated: $THREAD_PATH (position invalidated by push)\"\n    SHOULD_RESOLVE=true\n  elif grep -qFx \"${THREAD_PATH}:${THREAD_LINE}\" \"$DIFF_LINES_FILE\"; then\n    echo \"  ⏭️  Keeping open: ${THREAD_PATH}:${THREAD_LINE} (still in diff)\"\n    KEPT=$((KEPT + 1))\n  else\n    echo \"  \U0001F504 Stale: ${THREAD_PATH}:${THREAD_LINE} (no longer in diff)\"\n    SHOULD_RESOLVE=true\n  fi\n\n  if [ \"$SHOULD_RESOLVE\" = \"true\" ]; then\n    MUTATION_RESULT=$(gh api graphql -f query='\n      mutation($threadId: ID!) {\n        resolveReviewThread(input: { threadId: $threadId }) {\n          thread { id isResolved }\n        }\n      }\n    ' -f threadId=\"$THREAD_ID\" 2>&1) || {\n      echo \"  ⚠️  Failed to resolve thread $THREAD_ID (API error)\"\n      continue\n    }\n\n    if echo \"$MUTATION_RESULT\" | jq -e '.errors' > /dev/null 2>&1; then\n      echo \"  ⚠️  Failed to resolve thread $THREAD_ID: $(echo \"$MUTATION_RESULT\" | jq -c '.errors')\"\n      continue\n    fi\n\n    echo \"  ✅ Resolved thread $THREAD_ID\"\n    RESOLVED=$((RESOLVED + 1))\n  fi\ndone\n\necho \"\"\necho \"\U0001F4CB Summary: Resolved $RESOLVED thread(s), kept $KEPT thread(s) open\"\n"
    # ========================================
    # PROCESS PENDING FEEDBACK
    # Downloads feedback artifacts left by capture-feedback jobs
    # and processes them into memory before the review runs.
    # ========================================
    - name: Collect pending feedback
      if: steps.lock-check.outputs.skip != 'true'
      id: pending-feedback
      continue-on-error: true
      shell: bash
      env:
        GH_TOKEN: ${{ steps.resolve-token.outputs.token }}
        REPO: ${{ github.repository }}
      run: |
        ARTIFACTS=$(gh api "repos/$REPO/actions/artifacts?name=pr-review-feedback" \
          --jq '.artifacts[].id' 2>/dev/null || echo "")

        if [ -z "$ARTIFACTS" ]; then
          echo "has_feedback=false" >> $GITHUB_OUTPUT
          echo "ℹ️  No pending feedback to process"
          exit 0
        fi

        mkdir -p pending_feedback
        COMBINED=""
        COUNT=0

        for AID in $ARTIFACTS; do
          # Download artifact zip
          gh api "repos/$REPO/actions/artifacts/$AID/zip" > "feedback_$AID.zip" 2>/dev/null || continue
          unzip -o "feedback_$AID.zip" -d "pending_feedback/" 2>/dev/null || continue

          if [ -f pending_feedback/feedback.json ]; then
            FB_PATH=$(jq -r '.path // "unknown"' pending_feedback/feedback.json)
            FB_LINE=$(jq -r '.line // "?"' pending_feedback/feedback.json)
            FB_BODY=$(jq -r '.body // ""' pending_feedback/feedback.json)

            COMBINED+="- **File:** ${FB_PATH} (line ${FB_LINE})"$'\n'
            COMBINED+="  **Feedback:** ${FB_BODY}"$'\n\n'
            ((COUNT++)) || true
          fi

          rm -f pending_feedback/feedback.json

          # Delete processed artifact
          gh api "repos/$REPO/actions/artifacts/$AID" -X DELETE 2>/dev/null || true
        done

        if [ "$COUNT" -gt 0 ]; then
          echo "has_feedback=true" >> $GITHUB_OUTPUT
          {
            echo "prompt<<FEEDBACK_EOF"
            echo "$COMBINED"
            echo "FEEDBACK_EOF"
          } >> $GITHUB_OUTPUT
          echo "✅ Found $COUNT pending feedback item(s) to process"
        else
          echo "has_feedback=false" >> $GITHUB_OUTPUT
        fi
    - name: Process pending feedback
      if: steps.lock-check.outputs.skip != 'true' && steps.pending-feedback.outputs.has_feedback == 'true'
      continue-on-error: true
      uses: docker/cagent-action@1b9c152654008dab499d953b01e925e477cd6d5b # v1.5.5
      env:
        ACTION_PATH: ${{ github.action_path }}
      with:
        agent: ${{ env.ACTION_PATH }}/agents/pr-review-feedback.yaml
        prompt: |
          Developers left feedback on previous review comments. Learn from each item:

          ${{ steps.pending-feedback.outputs.prompt }}

          For each item:
          1. If they're correcting a false positive, add a memory to avoid this mistake
          2. If they're asking for clarification, note what was unclear
          3. If they're agreeing and adding context, store the additional insight

          Use add_memory to record what you learned from each feedback item.
        timeout: "180" # 3 min — haiku call; prevents hang from eating the 35-min job budget
        anthropic-api-key: ${{ inputs.anthropic-api-key }}
        openai-api-key: ${{ inputs.openai-api-key }}
        google-api-key: ${{ inputs.google-api-key }}
        aws-bearer-token-bedrock: ${{ inputs.aws-bearer-token-bedrock }}
        xai-api-key: ${{ inputs.xai-api-key }}
        nebius-api-key: ${{ inputs.nebius-api-key }}
        mistral-api-key: ${{ inputs.mistral-api-key }}
        github-token: ${{ steps.resolve-token.outputs.token }}
        extra-args: ${{ inputs.model && format('--model={0}', inputs.model) || '' }}
        skip-summary: "true"
        org-membership-token: ${{ inputs.org-membership-token }}
        auth-org: ${{ inputs.auth-org }}
        skip-auth: ${{ inputs.skip-auth }}
    # ========================================
    # BUILD REVIEW CONTEXT
    # ========================================
    - name: Build review context
      if: steps.lock-check.outputs.skip != 'true'
      id: context
      shell: bash
      env:
        PR_NUMBER: ${{ steps.resolve-context.outputs.pr-number }}
        EXTRA_PROMPT: ${{ inputs.additional-prompt }}
        REPO: ${{ github.repository }}
      run: |
        title=$(jq -r '.title' pr_metadata.json)
        author=$(jq -r '.author.login' pr_metadata.json)
        body=$(jq -r '.body // "No description provided."' pr_metadata.json)
        base=$(jq -r '.baseRefName' pr_metadata.json)
        head=$(jq -r '.headRefName' pr_metadata.json)
        files_count=$(wc -l < changed_files.txt | tr -d ' ')

        # Build review context (using echo to avoid YAML heredoc parsing issues)
        {
          echo "# Pull Request Review Request"
          echo ""
          echo "## PR Information"
          echo "- **URL**: https://github.com/${REPO}/pull/${PR_NUMBER}"
          echo "- **Title**: $title"
          echo "- **Author**: $author"
          echo "- **Branch**: $head → $base"
          echo "- **Files Changed**: $files_count"
          echo ""
          echo "## PR Description"
          echo "$body"
          echo ""
          echo "## Changed Files"
          echo ""
          cat changed_files.txt
          echo ""
          echo "---"
          echo ""
          echo "## Instructions"
          echo ""
          echo "Execute the review pipeline:"
          echo ""
          echo "1. **Gather**: Read the pre-fetched \`pr.diff\` file. If missing, run \`gh pr diff https://github.com/${REPO}/pull/${PR_NUMBER}\` (use the full URL, not just the number)"
          echo '2. **Draft**: Delegate to `drafter` agent to generate bug hypotheses'
          echo '3. **Verify**: For each hypothesis, delegate to `verifier` agent'
          echo '4. **Post**: Aggregate findings and post review via `gh api`'
          echo ""
          echo "Only report CONFIRMED and LIKELY findings. Always post as COMMENT (never APPROVE or REQUEST_CHANGES)."
        } > review_context.md

        # Append extra prompt if provided
        if [ -n "$EXTRA_PROMPT" ]; then
          {
            echo ""
            echo "## Additional Guidelines"
            echo ""
            echo "$EXTRA_PROMPT"
          } >> review_context.md
        fi

        # Save prompt to output for the action
        # Use a random delimiter to prevent injection via user-controlled content
        DELIM="PROMPT_EOF_$(openssl rand -hex 16)"
        {
          echo "review_prompt<<${DELIM}"
          cat review_context.md
          echo "${DELIM}"
        } >> "$GITHUB_OUTPUT"
    - name: Copy reference files
      if: steps.lock-check.outputs.skip != 'true'
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: |
        mkdir -p /tmp/refs
        cp "$ACTION_PATH"/agents/refs/*.md /tmp/refs/
    # ========================================
    # RUN REVIEW using root cagent-action
    # ========================================
    - name: Run PR Review
      if: steps.lock-check.outputs.skip != 'true'
      id: run-review
      uses: docker/cagent-action@1b9c152654008dab499d953b01e925e477cd6d5b # v1.5.5
      env:
        ACTION_PATH: ${{ github.action_path }}
      with:
        agent: ${{ env.ACTION_PATH }}/agents/pr-review.yaml
        prompt: ${{ steps.context.outputs.review_prompt }}
        timeout: "2700" # 45 min — allows complex reviews to complete; lock TTL (600 s) is intentionally shorter
        anthropic-api-key: ${{ inputs.anthropic-api-key }}
        openai-api-key: ${{ inputs.openai-api-key }}
        google-api-key: ${{ inputs.google-api-key }}
        aws-bearer-token-bedrock: ${{ inputs.aws-bearer-token-bedrock }}
        xai-api-key: ${{ inputs.xai-api-key }}
        nebius-api-key: ${{ inputs.nebius-api-key }}
        mistral-api-key: ${{ inputs.mistral-api-key }}
        github-token: ${{ steps.resolve-token.outputs.token }}
        extra-args: ${{ inputs.model && format('--model={0}', inputs.model) || '' }}
        add-prompt-files: ${{ inputs.add-prompt-files }}
        max-retries: "1" # One retry handles transient API failures (e.g. Anthropic 400s) without risking duplicate reviews from full pipeline restarts
        skip-summary: "true"
        org-membership-token: ${{ inputs.org-membership-token }}
        auth-org: ${{ inputs.auth-org }}
        skip-auth: ${{ inputs.skip-auth }}
    - name: Release review lock
      if: always() && steps.lock-check.outputs.skip != 'true'
      continue-on-error: true # Release failures are safe — stale locks expire via TTL (600s)
      shell: bash
      env:
        GH_TOKEN: ${{ steps.resolve-token.outputs.token }}
        REPO: ${{ github.repository }}
        PR_NUMBER: ${{ steps.resolve-context.outputs.pr-number }}
      run: "# Delete all cache entries matching this PR's lock prefix\ngh api --paginate \"repos/$REPO/actions/caches?key=pr-review-lock-${REPO}-${PR_NUMBER}-\" \\\n  --jq '.actions_caches[].id' 2>/dev/null | while read -r CACHE_ID; do\n  gh api \"repos/$REPO/actions/caches/$CACHE_ID\" -X DELETE 2>/dev/null || true\ndone\necho \"\U0001F513 Released review lock for PR #$PR_NUMBER\"\n"
    - name: Save reviewer memory
      if: always() && steps.lock-check.outputs.skip != 'true'
      continue-on-error: true # Don't fail if memory file doesn't exist (first run)
      uses: chainguard-actions/actions-cache/save@b5b76c7016521bd34554159c882773b3df2e994a # v5.0.5
      with:
        path: ${{ github.workspace }}/.cache/pr-review-memory.db
        key: pr-review-memory-${{ github.repository }}-${{ github.job }}-${{ github.run_id }}
    # ========================================
    # POST-REVIEW: Clean summary & reactions
    # ========================================
    - name: Post clean summary
      id: post-summary
      if: always()
      shell: bash
      env:
        GH_TOKEN: ${{ steps.resolve-token.outputs.token }}
        PR_NUMBER: ${{ steps.resolve-context.outputs.pr-number }}
        REPOSITORY: ${{ github.repository }}
        EXIT_CODE: ${{ steps.run-review.outputs.exit-code }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        VERBOSE_LOG_FILE: ${{ steps.run-review.outputs.verbose-log-file }}
        SKIP_REASON: ${{ steps.lock-check.outputs.skip-reason }}
        LOCK_AGE: ${{ steps.lock-check.outputs.lock-age }}
        CHUNK_COUNT: ${{ steps.chunk-diff.outputs.chunk_count }}
      run: "REVIEW_URL=\"https://github.com/$REPOSITORY/pull/$PR_NUMBER\"\necho \"review-url=$REVIEW_URL\" >> $GITHUB_OUTPUT\nTIMEOUT_NOTE=\"\"\n\nif [ \"$SKIP_REASON\" = \"concurrent\" ]; then\n  # Stay silent — the \U0001F440 reaction on the triggering comment (added by the\n  # run that won the lock) is sufficient feedback that a review is running.\n  # Posting a comment here creates noise and can trigger a comment loop.\n  STATUS=\"⏭️ **Review skipped** — another review is already in progress\"\nelif [ -z \"$EXIT_CODE\" ]; then\n  STATUS=\"⏭️ **Review skipped** — agent did not run\"\nelif [ \"$EXIT_CODE\" = \"124\" ]; then\n  # Timeout (SIGKILL after 2700 s) — provide actionable guidance\n  STATUS=\"⏱️ **Review timed out** (exit code: 124, limit: 2700 s)\"\n  TIMEOUT_NOTE=\"- **Exit code:** 124 (SIGKILL — 2700 s timeout)\"\n  TIMEOUT_NOTE+=$'\\n'\"- **Timeout limit:** 2700 s\"\n  TIMEOUT_NOTE+=$'\\n'\"- Verbose log artifact (${VERBOSE_LOG_FILE}) uploaded for debugging.\"\n  if [ -z \"${CHUNK_COUNT}\" ]; then\n    TIMEOUT_BODY=\"⏱️ **PR Review Timed Out** — The review agent hit the 2700 s time limit. Diff size is unknown (chunk-diff step did not produce output). Re-request a review from \\`docker-agent\\` to retry, or download the verbose log artifact for details.\"\n  elif [ \"${CHUNK_COUNT}\" = \"1\" ]; then\n    TIMEOUT_BODY=\"⏱️ **PR Review Timed Out** — The review agent hit the 2700 s time limit. The diff is small (1 chunk), so this may be an agent loop rather than a large-diff problem. Re-request a review from \\`docker-agent\\` to retry. If it times out again, download the verbose log artifact for details.\"\n  else\n    TIMEOUT_BODY=\"⏱️ **PR Review Timed Out** — The review agent hit the 2700 s time limit. This usually happens on large or complex diffs. Re-request a review from \\`docker-agent\\` to retry — if it times out again, consider splitting the PR into smaller pieces.\"\n  fi\n  if ! gh api \"repos/$REPOSITORY/issues/$PR_NUMBER/comments\" \\\n    -f body=\"$TIMEOUT_BODY\" \\\n    2>&1; then\n    echo \"::warning::Failed to post timeout comment to PR\"\n  fi\nelif [ \"$EXIT_CODE\" != \"0\" ]; then\n  # Check if agent actually posted a review despite the error exit code.\n  # This happens when a sub-agent fails (e.g., API overload) but the root\n  # agent recovers and posts the review itself.\n  if [ -n \"$VERBOSE_LOG_FILE\" ] && grep -qE 'pullrequestreview-[0-9]+' \"$VERBOSE_LOG_FILE\" 2>/dev/null; then\n    echo \"::warning::Agent exited $EXIT_CODE but a review was posted — treating as partial success\"\n    STATUS=\"⚠️ **Review completed with warnings** (exit code: $EXIT_CODE)\"\n  else\n    STATUS=\"❌ **Review failed** (exit code: $EXIT_CODE)\"\n    if ! gh api \"repos/$REPOSITORY/issues/$PR_NUMBER/comments\" \\\n      -f body=\"❌ **PR Review Failed** — The review agent encountered an error and could not complete the review. [View logs]($RUN_URL).\" \\\n      2>&1; then\n      echo \"::warning::Failed to post fallback comment to PR\"\n    fi\n  fi\nelse\n  STATUS=\"✅ **Review completed**\"\nfi\n\n# Override the default summary with a cleaner one for PR reviews\n{\n  echo \"\"\n  echo \"---\"\n  echo \"\"\n  echo \"## PR Review Summary\"\n  echo \"\"\n  echo \"$STATUS\"\n  if [ -n \"$TIMEOUT_NOTE\" ]; then\n    echo \"\"\n    printf '%s\\n' \"$TIMEOUT_NOTE\"\n  fi\n  echo \"\"\n  echo \"\U0001F4DD [View Pull Request #$PR_NUMBER]($REVIEW_URL)\"\n} >> $GITHUB_STEP_SUMMARY\n"
    - name: Add completion reaction
      if: steps.resolve-context.outputs.comment-id != '' && always() && steps.lock-check.outputs.skip != 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ steps.resolve-token.outputs.token }}
        EXIT_CODE: ${{ steps.run-review.outputs.exit-code }}
        REPO: ${{ github.repository }}
        COMMENT_ID: ${{ steps.resolve-context.outputs.comment-id }}
      run: |
        if [ "$EXIT_CODE" != "0" ]; then
          gh api "repos/$REPO/issues/comments/$COMMENT_ID/reactions" \
            -X POST -f content='confused' || true
        else
          gh api "repos/$REPO/issues/comments/$COMMENT_ID/reactions" \
            -X POST -f content='+1' || true
        fi
