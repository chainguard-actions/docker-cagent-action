name: Test basic usage with pr-number input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          pr-number: "1"
          skip-auth: "true"

      - name: Assert action ran and produced review-url output or failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
          REVIEW_URL: ${{ steps.action.outputs.review-url }}
        run: |
          echo "outcome: $OUTCOME"
          echo "review-url: $REVIEW_URL"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$REVIEW_URL" ]; then
              echo "FAIL: action succeeded but review-url output is empty"
              exit 1
            fi
            echo "PASS: action succeeded with review-url: $REVIEW_URL"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected — sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
