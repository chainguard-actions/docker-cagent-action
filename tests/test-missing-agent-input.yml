name: Test missing agent input validation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          # agent is required but not provided
          openai-api-key: "fake-key-for-validation-test"
          skip-auth: "true"
      - name: Assert action failed due to missing required input
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail when required 'agent' input is missing"
            exit 1
          fi
          echo "PASS: action correctly failed when required 'agent' input was missing"
