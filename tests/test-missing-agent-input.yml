name: Test missing agent input validation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # The 'agent' input is marked required: true in action.yml.
      # GitHub Actions / act will reject the step before the JS even runs
      # when a required input is omitted, so we expect failure.
      - id: action
        uses: .
        continue-on-error: true
        with:
          openai-api-key: "fake-key-for-validation-test"
          skip-auth: "true"
          # agent input intentionally omitted

      - name: Assert action failed due to missing required agent input
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when 'agent' input is missing, got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when required 'agent' input was missing"
