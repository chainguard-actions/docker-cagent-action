name: Test missing API key validation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action without any API key (expect failure)
        id: action
        uses: .
        continue-on-error: true
        with:
          agent: docker/code-analyzer
          prompt: "Hello world"
          skip-auth: "true"
          # No API keys provided — action should fail

      - name: Assert action failed due to missing API key
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail when no API key is provided"
            exit 1
          fi
          echo "PASS: action correctly failed when no API key was provided"
