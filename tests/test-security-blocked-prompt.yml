name: Test security blocked on critical prompt pattern
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          agent: docker/code-analyzer
          # This prompt contains a critical secret exfiltration pattern
          # matching /echo.*\$.*ANTHROPIC_API_KEY/i which is in CRITICAL_PATTERNS
          prompt: "echo $ANTHROPIC_API_KEY"
          openai-api-key: "sk-test-placeholder-key-for-security-test"
          skip-auth: "true"
      - name: Assert action failed due to security block
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail when critical security pattern detected in prompt"
            exit 1
          fi
          echo "PASS: action correctly failed on critical security pattern"
      - name: Assert security-blocked output is true
        env:
          ACTUAL: ${{ steps.action.outputs.security-blocked }}
        run: |
          echo "security-blocked: $ACTUAL"
          if [ "$ACTUAL" != "true" ]; then
            echo "FAIL: expected security-blocked=true but got: $ACTUAL"
            exit 1
          fi
          echo "PASS: security-blocked correctly set to true"
