name: Test skip-auth bypasses authorization check
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          agent: docker/code-analyzer
          prompt: "List files in the current directory"
          openai-api-key: "sk-test-placeholder-key-for-auth-test"
          skip-auth: "true"
          # Use a very short timeout so the action fails fast if it gets to execution
          timeout: "5"
      - name: Assert action did not fail due to authorization
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          # The action should NOT fail with "Authorization failed"
          # It may fail for other reasons (binary download, API key invalid, etc.)
          # but skip-auth=true should bypass the auth check
          echo "PASS: action proceeded past authorization check (outcome: ${{ steps.action.outcome }})"
      - name: Assert mcp-gateway-installed output is false by default
        env:
          ACTUAL: ${{ steps.action.outputs.mcp-gateway-installed }}
        run: |
          echo "mcp-gateway-installed: $ACTUAL"
          # mcp-gateway is not requested, so it should be false (if set)
          if [ -n "$ACTUAL" ] && [ "$ACTUAL" != "false" ]; then
            echo "FAIL: expected mcp-gateway-installed=false but got: $ACTUAL"
            exit 1
          fi
          echo "PASS: mcp-gateway-installed is false or unset (value: $ACTUAL)"
