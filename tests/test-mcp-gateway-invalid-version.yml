name: Test mcp-gateway invalid version validation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # When mcp-gateway=true but mcp-gateway-version has an invalid format,
      # the action should fail with a validation error before downloading anything.
      - id: action
        uses: .
        continue-on-error: true
        with:
          agent: docker/code-analyzer
          openai-api-key: "sk-fake-key-for-mcp-test"
          skip-auth: "true"
          skip-summary: "true"
          mcp-gateway: "true"
          mcp-gateway-version: "invalid-version-format"

      - name: Assert action failed due to invalid mcp-gateway version
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid mcp-gateway-version, got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid mcp-gateway-version format"
