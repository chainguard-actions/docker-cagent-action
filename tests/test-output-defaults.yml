name: Test output defaults on validation failure
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with no API key to trigger early failure
        id: action
        uses: .
        continue-on-error: true
        with:
          agent: docker/code-analyzer
          skip-auth: "true"
          # No API key — triggers early validation failure

      - name: Assert action outcome is failure
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure outcome, got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed"

      - name: Assert security-blocked defaults to false on validation failure
        env:
          SECURITY_BLOCKED: ${{ steps.action.outputs.security-blocked }}
        run: |
          echo "security-blocked: $SECURITY_BLOCKED"
          # On early validation failure (no API key), security-blocked should be false
          # because no prompt was processed
          if [ "$SECURITY_BLOCKED" = "true" ]; then
            echo "FAIL: security-blocked should not be true on API key validation failure"
            exit 1
          fi
          echo "PASS: security-blocked is not true on validation failure"

      - name: Assert prompt-suspicious defaults to false on validation failure
        env:
          PROMPT_SUSPICIOUS: ${{ steps.action.outputs.prompt-suspicious }}
        run: |
          echo "prompt-suspicious: $PROMPT_SUSPICIOUS"
          # No prompt was provided, so prompt-suspicious should be false
          if [ "$PROMPT_SUSPICIOUS" = "true" ]; then
            echo "FAIL: prompt-suspicious should not be true when no prompt was provided"
            exit 1
          fi
          echo "PASS: prompt-suspicious is not true when no prompt provided"
