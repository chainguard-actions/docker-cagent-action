name: Test API key inputs coverage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          agent: "docker/code-analyzer"
          prompt: "hello"
          anthropic-api-key: "test-anthropic-key"
          aws-bearer-token-bedrock: "test-aws-bearer-token"
          github-token: ${{ github.token }}
          google-api-key: "test-google-key"
          mistral-api-key: "test-mistral-key"
          nebius-api-key: "test-nebius-key"
          xai-api-key: "test-xai-key"
          skip-auth: "true"
          timeout: "30"
          yolo: "true"
      - name: Assert action ran and produced outputs
        env:
          EXIT_CODE: ${{ steps.action.outputs.exit-code }}
          SECURITY_BLOCKED: ${{ steps.action.outputs.security-blocked }}
        run: |
          echo "exit-code: $EXIT_CODE"
          echo "security-blocked: $SECURITY_BLOCKED"
          # The action may fail due to invalid API keys, but it should have run
          # and produced some output. We just verify the step completed.
          echo "PASS: action step completed with all API key inputs provided"
