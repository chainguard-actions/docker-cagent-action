name: Test invalid mcp-gateway version validation
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with mcp-gateway=true and invalid version (expect failure)
        id: action
        uses: .
        continue-on-error: true
        with:
          agent: docker/code-analyzer
          skip-auth: "true"
          openai-api-key: "fake-key-for-test"
          mcp-gateway: "true"
          mcp-gateway-version: "invalid-version-format"

      - name: Assert action failed due to invalid mcp-gateway version
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid mcp-gateway version, got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid mcp-gateway version format"
