name: Test invalid mcp-gateway version format validation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          agent: docker/code-analyzer
          prompt: "Analyze this code"
          openai-api-key: "sk-test-placeholder-key-for-validation"
          skip-auth: "true"
          mcp-gateway: "true"
          # Provide an invalid version format (not vX.Y.Z)
          mcp-gateway-version: "invalid-version"
      - name: Assert action failed due to invalid mcp-gateway version
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail when mcp-gateway-version has invalid format"
            exit 1
          fi
          echo "PASS: action correctly failed on invalid mcp-gateway version format"
