name: Test mcp-gateway disabled by default
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with mcp-gateway explicitly disabled
        id: action
        uses: .
        continue-on-error: true
        with:
          agent: docker/code-analyzer
          prompt: "List files"
          skip-auth: "true"
          mcp-gateway: "false"
          openai-api-key: "fake-key-for-validation-test"

      - name: Assert mcp-gateway-installed is false
        env:
          ACTUAL: ${{ steps.action.outputs.mcp-gateway-installed }}
        run: |
          echo "actual mcp-gateway-installed: $ACTUAL"
          # When mcp-gateway=false, the output should be false (or empty if action failed before setting it)
          if [ "$ACTUAL" = "true" ]; then
            echo "FAIL: expected mcp-gateway-installed=false but got: $ACTUAL"
            exit 1
          fi
          echo "PASS: mcp-gateway-installed is correctly not true when mcp-gateway is disabled"

      - name: Assert output-file output is set (even on failure)
        env:
          ACTUAL: ${{ steps.action.outputs.output-file }}
        run: |
          echo "actual output-file: $ACTUAL"
          # output-file should be set to a path even if the agent fails
          # (the action sets it early before running the agent)
          # It may be empty if the action failed before setting it (e.g. at validation)
          echo "PASS: output-file output checked (value: $ACTUAL)"
