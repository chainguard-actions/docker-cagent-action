name: Test graceful failure without OIDC credentials
# The action fetches credentials from AWS Secrets Manager via OIDC.
# In the act harness there are no OIDC tokens or AWS credentials, so the
# action is expected to fail. We verify it fails gracefully (non-zero exit)
# rather than hanging or producing a misleading success.
on:
  workflow_dispatch:

jobs:
  test-graceful-failure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Verify dist/credentials.js exists in the repo
        run: |
          if [ ! -f "$GITHUB_WORKSPACE/dist/credentials.js" ]; then
            echo "INFO: dist/credentials.js not found at $GITHUB_WORKSPACE/dist/credentials.js"
            echo "The action references \$GITHUB_ACTION_PATH/../dist/credentials.js"
            echo "Checking relative to action dir..."
            ls -la "$GITHUB_WORKSPACE/" || true
            ls -la "$GITHUB_WORKSPACE/dist/" 2>/dev/null || echo "No dist/ directory found"
          else
            echo "PASS: dist/credentials.js found"
          fi

      - id: action
        uses: .
        continue-on-error: true

      - name: Assert action failed gracefully without OIDC credentials
        env:
          OUTCOME: ${{ steps.action.outcome }}
          TOKEN: ${{ env.GITHUB_APP_TOKEN }}
        run: |
          echo "outcome: $OUTCOME"
          echo "GITHUB_APP_TOKEN set: $([ -n "$TOKEN" ] && echo yes || echo no)"
          if [ "$OUTCOME" = "success" ]; then
            # If somehow it succeeded, GITHUB_APP_TOKEN must be set
            if [ -z "$TOKEN" ]; then
              echo "FAIL: action reported success but GITHUB_APP_TOKEN is empty"
              exit 1
            fi
            echo "PASS: action succeeded and GITHUB_APP_TOKEN is set"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected (no OIDC/AWS credentials in harness)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
